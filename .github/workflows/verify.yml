name: Verify

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24
      - run: npm ci
      - name: Install Playwright Chromium dependencies
        run: npx playwright install --with-deps chromium
      - name: Lint, typecheck, test, E2E, build
        env:
          DATABASE_PATH: /tmp/book-reader-ci.db
        run: npm run verify
