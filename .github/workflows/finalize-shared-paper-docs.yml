name: Finalize shared Paper docs

on:
  push:
    branches:
      - issue-7-shared-paper-library

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append shared Paper records
        run: |
          python - <<'PY'
          from pathlib import Path

          def append_once(path: str, marker: str, block: str) -> None:
              p = Path(path)
              current = p.read_text(encoding="utf-8")
              if marker in current:
                  return
              p.write_text(current.rstrip() + "\n\n" + block.strip() + "\n", encoding="utf-8")

          append_once(
              "docs/HUMAN-TASKS.md",
              "## H-11. Shared Paper Library の本番有効化",
              r'''
          ---

          ## H-11. Shared Paper Library の本番有効化

          **Status:** HUMAN  
          **GitHub Issue:** #10  
          **Depends on:** Paper Collector #86、Reader #7 / PR #8

          **なぜ人間またはローカルエージェントが必要か**
          本番の共有D1 migration、Cloudflare deploy、Accessで保護された本番環境へのサインインと実データsmoke testが必要になる。Chat上のエージェントは本番credentialと保護されたブラウザセッションを持たない。

          **必須順序**

          1. Paper Collector #86 を先に進め、共有本番D1にCollector-ownedの `papers` と `paper_retention_refs` が存在することを確認する。
          2. 無ければReader側で作らず、Paper Collectorのmigrationを適用する。
          3. Readerの `migrations/0004_shared_paper_link.sql` を適用する。
          4. Readerをdeployする。
          5. Book Reader #10 に記載したproduction smoke testを実行する。

          **安全規約**

          - productionへdevelopment seedを流さない。
          - migration historyを偽装しない。
          - `papers` / `paper_retention_refs` はPaper Collector所有。Reader migrationから作成・変更しない。
          - 本番だけで起きる差異は、その場で推測修正せず先にIssue化する。

          **伝えること**: Book Reader #10 のchecklist結果。失敗があれば該当項目・レスポンス/ログ・可能ならスクリーンショット。
          ''',
          )

          append_once(
              "docs/WORKMAP.md",
              "## SHAREDLIB-001 — Reader documents と shared canonical Paper Library の統合",
              r'''
          ---

          ## SHAREDLIB-001 — Reader documents と shared canonical Paper Library の統合
          **Status:** DONE  
          **Priority:** P1  
          **Issue / PR:** #7 / #8

          ### Result

          - Reader `documents.paper_id` でcanonical Paperを任意リンクできる。
          - canonical PDF bytesはReader storageへ複製せず、認証済み `/api/documents/:id/source` 経由で読む。
          - linked Reader documentは `paper_retention_refs` の `owner = 'book-reader'` でPaper Collector GCから保護する。
          - Reader title / progress / highlights / notes / conversationsはReader-ownedのままcanonical scholarly metadataへwrite backしない。
          - 通常のPDF/EPUB uploadとDocumentStorage/R2経路は維持する。
          - Reader migrationはCollector-ownedの `papers` / `paper_retention_refs` を作成・変更しない。

          ### Verify

          - GitHub Actions Verify #29 (`34148581981`)
          - lint / typecheck / unit tests / full Chromium E2E / production build が全通過。
          - canonical linkage、retention lifecycle、remote PDF source、通常upload/deleteの回帰testを含む。

          判断理由は `docs/DECISIONS.md` D-48。

          ### Follow-up

          - production activationはHUMAN: Book Reader #10 / `docs/HUMAN-TASKS.md` H-11。
          - shared D1のCollector migration/deploy prerequisiteはPaper Collector #86。

          ### Execution Log — 2026-09-08

          - Result: optional canonical Paper linkage、PDF byte非複製のauthenticated remote-source reading、Collector retention guardを追加し、通常import経路を維持した。
          - Verification: GitHub Actions Verify #29 (`34148581981`) — lint、typecheck、unit tests、full Chromium E2E、production build。
          - Important decision: canonical Paper/retention schemaはPaper Collectorが所有し、Readerは参照とReader固有状態のみを所有する。
          - Follow-up: 本番有効化はBook Reader #10でHUMAN。Paper Collector #86の完了が先行条件。
          ''',
          )

          append_once(
              "docs/DECISIONS.md",
              "## D-48 — Readerはcanonical Paperを参照し、PDF bytesを複製せず、retention refでGCを防ぐ",
              r'''
          ---

          ## D-48 — Readerはcanonical Paperを参照し、PDF bytesを複製せず、retention refでGCを防ぐ

          ### Context

          Paper Collectorの `papers` をcanonical scholarly identityとしてReaderから再利用したい。一方、Readerは単体local SQLiteでも動く必要があり、Reader固有のtitle customization・読書状態・annotationをcanonical scholarly metadataへ書き戻してはならない。またCollector GCがReaderから参照中のPaperを削除してはならない。

          ### Decision

          - `documents.paper_id` はnullableなcross-app identityとする。
          - Reader側から `papers` へのFKは張らない。local Reader DBはCollector schemaなしで起動可能なままにする。
          - `papers` と `paper_retention_refs` のschema/migration ownershipはPaper Collectorに置く。Readerはquery descriptorとしてのみ参照する。
          - canonical PaperのPDFはReader storageへ複製せず、`pdf_url ?? source_url` をauthenticated Reader `/api/documents/:id/source` からproxyし、Rangeをforwardする。
          - Reader title / progress / highlights / notes / conversationsはReader-ownedとし、canonical Paper metadataへwrite backしない。
          - explicit uploadは従来どおりDocumentStorage/R2を使う。
          - attach時はReader rowを作成後にretention ref (`owner = 'book-reader'`) を確立し、retention作成失敗時はReader rowをrollbackする。
          - delete時はReader rowを削除後にretention refをreleaseする。cleanup失敗でstale refが残る方が、live referenceを早期releaseしてCollector GCへ露出するより安全。
          - production activationはCollector側migration（少なくとも `papers` / `paper_retention_refs`）を先に完了し、その後Reader migration/deployを行う。

          ### Why

          canonical identity・sourceを重複させず、Reader固有状態のownershipを維持し、Collector GCとのlifecycle raceをretention contractで明示的に防げる。Reader単体local modeも犠牲にしない。

          ### Revisit when

          shared D1による直接cross-app schema accessを廃止し、Paper lifecycleを専用API/serviceへ移す場合。
          ''',
          )
          PY
      - name: Commit documentation and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/finalize-shared-paper-docs.yml
          git add docs/HUMAN-TASKS.md docs/WORKMAP.md docs/DECISIONS.md .github/workflows/finalize-shared-paper-docs.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record shared Paper integration"
          git push origin HEAD:${GITHUB_REF_NAME}
