name: Deploy

# Deploys the Worker from main, so what is live is what GitHub has.
#
# Dormant until CLOUDFLARE_API_TOKEN exists: without it every push to main
# would end in a red run for a step that was never going to work. See
# docs/HUMAN-TASKS.md, task H-9.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deploy at a time, and never half of an older one on top of a newer.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: credentials
        name: Check for Cloudflare credentials
        run: echo "present=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.credentials.outputs.present != 'true'
        name: Explain the skip
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set, so this deploy was skipped. See docs/HUMAN-TASKS.md, task H-9."

      - if: steps.credentials.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.credentials.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24
      - if: steps.credentials.outputs.present == 'true'
        run: npm ci

      # Before the code that expects them. A migration only ever adds tables and
      # columns, so the running Worker keeps working until the new one replaces
      # it; deploying first would leave the new code reading a column that does
      # not exist yet.
      - if: steps.credentials.outputs.present == 'true'
        name: Apply D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply book-reader --remote

      - if: steps.credentials.outputs.present == 'true'
        name: Build and deploy the Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run cf:deploy

      # The audience tag is regenerated outside any deploy, and a mismatch is
      # almost silent: sign-in succeeds and the application refuses anyway.
      - if: steps.credentials.outputs.present == 'true'
        name: Check the Access audience still matches
        run: npm run check:access
